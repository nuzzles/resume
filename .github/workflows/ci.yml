name: CI
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Build | Résumé
        uses: xu-cheng/latex-action@v3
        with:
          latexmk_shell_escape: true
          latexmk_use_xelatex: true
          root_file: ./resume.tex

      - name: Build | Coverletter
        uses: xu-cheng/latex-action@v3
        with:
          latexmk_shell_escape: true
          latexmk_use_xelatex: true
          root_file: ./coverletter.tex

      - name: Upload PDFs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            resume.pdf
            coverletter.pdf
          if-no-files-found: error

  pages:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Download PDFs
        uses: actions/download-artifact@v4
        with:
          name: pdfs

      - name: Stage | PDFs
        run: |
          mkdir pub/
          mv resume.pdf coverletter.pdf pub/

      - name: Setup | Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup | Jinja2
        run: python -m pip install jinja2

      - name: Stage | HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader

          env = Environment(loader=FileSystemLoader('.'))
          pages = {
              'index.html': ('index.html.j2', 'resume.pdf'),
              'embed.html': ('embed.html.j2', 'resume.pdf'),
              'resume.html': ('index.html.j2', 'resume.pdf'),
              'resume-embed.html': ('embed.html.j2', 'resume.pdf'),
              'coverletter.html': ('index.html.j2', 'coverletter.pdf'),
              'coverletter-embed.html': ('embed.html.j2', 'coverletter.pdf'),
          }
          for filename, (template, pdf) in pages.items():
              html = env.get_template(f'templates/{template}').render(PDF=pdf)
              Path('pub', filename).write_text(html, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pub/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
