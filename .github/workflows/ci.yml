name: CI
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Build | Résumé
        uses: xu-cheng/latex-action@v3
        with:
          latexmk_shell_escape: true
          latexmk_use_xelatex: true
          root_file: ./resume.tex

      - name: Build | Coverletter
        uses: xu-cheng/latex-action@v3
        with:
          latexmk_shell_escape: true
          latexmk_use_xelatex: true
          root_file: ./coverletter.tex

      - name: Upload PDFs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            resume.pdf
            coverletter.pdf
          if-no-files-found: error

  pages:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Download PDFs
        uses: actions/download-artifact@v4
        with:
          name: pdfs

      - name: Stage | PDFs
        run: |
          mkdir pub/
          mv resume.pdf coverletter.pdf pub/

      - name: Setup | Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup | j2cli
        run: |
          python -m pip install j2cli
          j2 --version

      - name: Stage | HTML
        run: |
          PDF='resume.pdf' j2 templates/index.html.j2 > pub/index.html
          PDF='resume.pdf' j2 templates/embed.html.j2 > pub/embed.html
          PDF='resume.pdf' j2 templates/index.html.j2 > pub/resume.html
          PDF='resume.pdf' j2 templates/embed.html.j2 > pub/resume-embed.html
          PDF='coverletter.pdf' j2 templates/index.html.j2 > pub/coverletter.html
          PDF='coverletter.pdf' j2 templates/embed.html.j2 > pub/coverletter-embed.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pub/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
