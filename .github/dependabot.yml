version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # Keep j2cli on the validated setuptools 80.x series.
      - dependency-name: "setuptools"
        versions: [">=81"]
